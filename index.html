
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Augment Impact | Coming Soon</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;

            background: #82c2c5;

            font-family: 'Montserrat', sans-serif;
        }

        /* Full-screen gradient background */

       
/* Full-screen animated gradient */

.container {
    position: relative;

    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 60px 25px;
    overflow: hidden;

    background: linear-gradient(
        120deg,
        #77cdbb,
        #8bb9ca,
        #78b8cc,
        #77cdbb
    );

    background-size: 300% 300%;

    animation: gradientMove 15s ease infinite;

    text-align: center;
    isolation: isolate;
}

/* Slowly moving background */

@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

/* Dark blue color that follows the cursor */


/* Dark blue cursor trail */

.trail {
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(25, 83, 150, 0.55) 0%,
        rgba(35, 104, 161, 0.40) 30%,
        rgba(48, 127, 176, 0.20) 55%,
        rgba(48, 127, 176, 0) 75%
    );

    pointer-events: none;

    z-index: 1;

    transform: translate(-50%, -50%);

    animation: trailFade 3s ease-out forwards;
}

/* Each trail mark slowly disappears */

@keyframes trailFade {

    0% {
        opacity: 1;
    }

    30% {
        opacity: 0.9;
    }

    100% {
        opacity: 0;
    }

}

/* Keep the trail behind the text */

.content {
    position: relative;
    z-index: 5;
}

/* Keep bubbles above the trail */

.bubble {
    z-index: 2;
}

        /* Main content */

        .content {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 1500px;

            color: white;
        }

        /* Main heading */

        h1 {
            font-family: 'Barlow Condensed', sans-serif;

            font-size: clamp(48px, 8vw, 125px);
            font-weight: 600;

            letter-spacing: 5px;
            line-height: 1.1;

            color: #ffffff;

            white-space: nowrap;
        }

        /* Tagline */

        .tagline {
            margin-top: 25px;

            font-family: 'Montserrat', sans-serif;

            font-size: clamp(12px, 2vw, 26px);
            font-weight: 400;

            letter-spacing: 3px;
            line-height: 1.6;

            color: white;

            white-space: nowrap;
        }

        .augment {
            position: relative;
            display: inline-block;

            font-weight: 700;
        }

        /* Stationary sparkle */

        .sparkle {
            position: absolute;

            top: -15px;
            right: -14px;

            color: #fff5c7;

            font-size: 22px;
            font-weight: 400;

            text-shadow:
                0 0 8px rgba(255,255,255,0.6);
        }

        /* Coming Soon */

        .coming-soon {
            margin-top: 24px;

            font-family: 'Montserrat', sans-serif;

            font-size: clamp(22px, 3vw, 43px);
            font-weight: 400;

            letter-spacing: 9px;

            color: white;

            white-space: nowrap;
        }

        /* Animated dots */

        .dots {
            display: inline-flex;
            width: 1.5em;

            letter-spacing: 0;
            justify-content: flex-start;
        }

        .dots span {
            opacity: 0;
            animation: dotAnimation 1.5s infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dotAnimation {

            0%, 15% {
                opacity: 0;
            }

            35%, 75% {
                opacity: 1;
            }

            90%, 100% {
                opacity: 0;
            }

        }

        /* Organic glass bubbles */

        .bubble {
            position: absolute;
            z-index: 1;

            border-radius:
                43% 57% 62% 38% /
                48% 42% 58% 52%;

            border: 2px solid
                rgba(255,255,255,0.35);

            background: radial-gradient(
                ellipse at 28% 22%,
                rgba(255,255,255,0.48) 0%,
                rgba(255,255,255,0.18) 25%,
                rgba(255,255,255,0.04) 65%,
                rgba(255,255,255,0.12) 100%
            );

            box-shadow:
                inset 5px 6px 15px
                    rgba(255,255,255,0.35),
                inset -8px -10px 20px
                    rgba(255,255,255,0.12),
                0 0 20px
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(3px);

            pointer-events: none;

            animation: floatBubble
                9s ease-in-out infinite alternate;
        }

        /* Large organic bubbles */

        .bubble1 {
            width: 350px;
            height: 310px;

            top: -140px;
            left: -90px;

            animation-duration: 11s;
        }

        .bubble2 {
            width: 330px;
            height: 300px;

            left: -90px;

            border-radius:
                55% 45% 38% 62% /

            animation-duration: 13s;
            animation-delay: -4s;
        }

        .bubble3 {

            height: 340px;

            bottom: -120px;
            right: -100px;

            border-radius:
                62% 38% 55% 45% /

                60% 40% 43% 57% /
                48% 60% 40% 52%;

            animation-delay: -5s;

        /* Smaller floating bubbles */

        .bubble5 {
            width: 65px;
            height: 80px;

            top: 10%;
            left: 24%;

            animation-duration: 8s;
        }

        .bubble6 {
            width: 55px;
            height: 70px;

            top: 52%;
            left: 8%;

            animation-duration: 9s;
            animation-delay: -2s;
        }

        .bubble7 {
            width: 70px;
            height: 85px;

            bottom: 10%;
            right: 23%;

            animation-duration: 10s;
            animation-delay: -4s;
        }

        .bubble8 {
            width: 35px;
            height: 35px;

            top: 16%;
            right: 22%;

            animation-duration: 7s;
        }

        .bubble9 {
            width: 38px;
            height: 38px;

            bottom: 15%;
            left: 25%;

            animation-duration: 8s;
            animation-delay: -3s;
        }

        .bubble10 {
            width: 30px;
            height: 30px;

            top: 37%;
            left: 5%;

            animation-duration: 6s;
            animation-delay: -2s;
        }

        .bubble11 {
            width: 40px;
            height: 40px;

            top: 48%;
            right: 5%;

            animation-duration: 8s;
            animation-delay: -5s;
        }

        .bubble12 {
            width: 45px;
            height: 55px;

            bottom: 5%;
            left: 35%;

            animation-duration: 9s;
            animation-delay: -3s;
        }

        /* Gentle bubble movement */

        @keyframes floatBubble {

            0% {
                transform:
                    translate(0, 0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translate(12px, -18px)
                    rotate(8deg);
            }

            100% {
                transform:
                    translate(-10px, 12px)
                    rotate(-6deg);
            }

        /* Tablet responsiveness */

        @media (max-width: 900px) {

            h1 {

        }

        .topbar {
            position: fixed;

        .brand {

        .access-card {

        @media (max-width: 700px) {

        /* Accessibility */

        @media (prefers-reduced-motion: reduce) {

            .bubble,
            .dots span {
                animation: none;
            }

            .dots span {
                opacity: 1;
            }

        }

    </style>

<body>

    <div class="access-overlay" id="accessOverlay">
        <div class="access-card">

                <input id="accessInput" type="password" maxlength="4" placeholder="Enter code" aria-label="Access code" />
                <button type="submit">Enter</button>
            </form>
            <div class="access-error" id="accessError"></div>
        </div>
    </div>

    <header class="topbar">

        <nav class="nav-links" aria-label="Main menu">

        <!-- Organic floating bubbles -->

        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>

        <div class="bubble bubble4"></div>

        <div class="bubble bubble5"></div>

        <div class="bubble bubble12"></div>

        <!-- Main website content -->

        <div class="content">

            <h1>THE AUGMENT IMPACT</h1>

            <p class="tagline">
                Help make a smile. Help
                <span class="augment">
                    augment<span class="sparkle">✦</span>
                </span>
                a reality.
            </p>

            <div class="coming-soon">
                COMING SOON<span class="dots"><span>.</span><span>.</span><span>.</span></span>
            </div>

        </div>

    </main>



<script>

const ACCESS_CODE = "1234";
const accessOverlay = document.getElementById("accessOverlay");
const accessForm = document.getElementById("accessForm");
const accessInput = document.getElementById("accessInput");
const accessError = document.getElementById("accessError");

accessOverlay.classList.remove("hidden");

accessForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const enteredCode = accessInput.value.trim();

    if (enteredCode === ACCESS_CODE) {
        accessOverlay.classList.add("hidden");
        accessError.textContent = "";
        accessInput.value = "";
        return;
    }

    accessError.textContent = "Incorrect access code. Please try again.";
    accessInput.value = "";
    accessInput.focus();
});

const container = document.querySelector(".container");

let lastX = null;
let lastY = null;

let lastTime = 0;

// Create a dark blue mark at a specific position

function createTrail(x, y) {

    const trail = document.createElement("div");

    trail.className = "trail";

    trail.style.left = x + "px";
    trail.style.top = y + "px";

    container.appendChild(trail);

    // Remove the mark after its animation finishes

    trail.addEventListener("animationend", function() {

        trail.remove();

    });

}

// Track cursor movement across the page

container.addEventListener("pointermove", function(event) {

    // Ignore touch input

    if (event.pointerType === "touch") {
        return;
    }

    const rect = container.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const now = performance.now();

    // Limit how frequently new trail marks are created

    if (now - lastTime < 16) {
        return;
    }

    lastTime = now;

    // Fill the space between the previous and current
    // cursor positions to create a continuous trail

    if (lastX !== null && lastY !== null) {

        const dx = x - lastX;
        const dy = y - lastY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        const steps = Math.min(
            Math.ceil(distance / 25),
            20
        );

        for (let i = 1; i <= steps; i++) {

            const progress = i / steps;

            const trailX = lastX + dx * progress;
            const trailY = lastY + dy * progress;

            createTrail(trailX, trailY);

        }

    } else {

        createTrail(x, y);

    }

    lastX = x;
    lastY = y;

});

// Reset tracking when the cursor leaves the page

container.addEventListener("pointerleave", function() {

    lastX = null;
    lastY = null;

});

</script>
